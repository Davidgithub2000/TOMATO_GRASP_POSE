# TomatoPose-YOLO11-v3
# Compatible with Ultralytics YOLO11-style YAML.
# Keypoints: 0 calyx, 1 bottom, 2 left, 3 right

nc: 1
kpt_shape: [4, 3]

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]       # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]      # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]]      # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]]      # 5-P4/16
  - [-1, 2, C3k2, [512, True]]      # 6
  - [-1, 1, Conv, [1024, 3, 2]]     # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]     # 8
  - [-1, 1, SPPF, [1024, 5]]        # 9
  - [-1, 2, C2PSA, [1024]]          # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 11
  - [[-1, 6], 1, Concat, [1]]                   # 12
  - [-1, 2, C3k2, [512, False]]                 # 13 P4

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 14
  - [[-1, 4], 1, Concat, [1]]                   # 15
  - [-1, 2, C3k2, [256, False]]                 # 16 P3

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 17
  - [[-1, 2], 1, Concat, [1]]                   # 18
  - [-1, 2, C3k2, [128, False]]                 # 19 P2
  - [-1, 1, FeatureBalance, []]                 # 20 weighted balance P2

  - [-1, 1, Conv, [128, 3, 2]]                  # 21
  - [[-1, 16], 1, Concat, [1]]                  # 22
  - [-1, 2, C3k2, [256, False]]                 # 23 P3
  - [-1, 1, FeatureBalance, []]                 # 24 weighted balance P3

  - [-1, 1, Conv, [256, 3, 2]]                  # 25
  - [[-1, 13], 1, Concat, [1]]                  # 26
  - [-1, 2, C3k2, [512, False]]                 # 27 P4
  - [-1, 1, FeatureBalance, []]                 # 28 weighted balance P4

  - [-1, 1, Conv, [512, 3, 2]]                  # 29
  - [[-1, 10], 1, Concat, [1]]                  # 30
  - [-1, 2, C3k2, [1024, True]]                 # 31 P5
  - [-1, 1, FeatureBalance, []]                 # 32 weighted balance P5

  - [[20, 24, 28, 32], 1, Pose, [nc, kpt_shape]] # 33 Pose(P2,P3,P4,P5)
